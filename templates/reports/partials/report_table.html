<table class="w-full text-sm">
  <thead class="table-head">
    <tr>
      {% for column in columns %}<th class="px-3 py-2">{{ column }}</th>{% endfor %}
    </tr>
  </thead>
  <tbody>
    {% for row in rows %}
    <tr class="border-t border-slate-100 dark:border-slate-700">
      {% for value in row %}<td class="px-3 py-2 text-slate-700 dark:text-slate-300">{{ value }}</td>{% endfor %}
    </tr>
    {% else %}
    <tr><td colspan="{{ columns | length }}" class="px-3 py-8 text-center text-slate-500 dark:text-slate-400">{{ t("reports.empty") }}</td></tr>
    {% endfor %}
  </tbody>
</table>
