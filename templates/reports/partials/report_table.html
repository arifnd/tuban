<table class="w-full text-sm">
  <thead class="table-head">
    <tr>
      {% for column in columns %}<th scope="col" class="{% if loop.first %}w-full {% endif %}px-3 py-2">{{ column }}</th>{% endfor %}
    </tr>
  </thead>
  <tbody>
    {% for row in rows %}
    <tr class="border-t border-border">
      {% for value in row %}<td class="{% if loop.first %}w-full {% endif %}px-3 py-2 text-muted-foreground">{{ value }}</td>{% endfor %}
    </tr>
    {% else %}
    <tr><td colspan="{{ columns | length }}" class="px-3 py-8 text-center text-muted-foreground">{{ t("reports.empty") }}</td></tr>
    {% endfor %}
  </tbody>
</table>
