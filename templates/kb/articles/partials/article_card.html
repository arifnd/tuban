<li class="flex items-center justify-between gap-3 py-2.5">
  <a href="/kb/articles/{{ article.slug }}" class="min-w-0 flex-1 text-sm font-medium text-foreground hover:text-brand-700 dark:hover:text-white">
    <span class="line-clamp-1">{{ article.title }}</span>
    {% if article.category %}<span class="mt-0.5 block text-xs text-muted-foreground">{{ article.category.name }}</span>{% endif %}
  </a>
  <span class="shrink-0 text-xs text-muted-foreground">{{ article.view_count }} {{ t("kb.views") }}</span>
</li>
