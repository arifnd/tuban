{% from "partials/icons.html" import icon with context %}
<div x-data="{ theme: (typeof window !== 'undefined' && window.APP_THEME) || 'system' }">
  <button type="button" @click="theme = (theme === 'dark') ? 'light' : 'dark'; window.setTheme(theme)"
          title="{{ t('nav.theme') }}" aria-label="{{ t('nav.theme') }}"
          class="rounded-md p-2 text-muted-foreground hover:bg-accent">
    <span class="block dark:hidden">{{ icon("moon", "w-5 h-5") }}</span>
    <span class="hidden dark:block">{{ icon("sun", "w-5 h-5") }}</span>
  </button>
</div>
