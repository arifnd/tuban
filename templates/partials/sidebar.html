{% from "partials/icons.html" import icon with context %}
<aside class="hidden w-60 shrink-0 flex-col border-r border-slate-200 bg-white md:flex dark:border-slate-800 dark:bg-slate-900">
  <div class="flex h-14 shrink-0 items-center gap-2 border-b border-slate-200 px-4 dark:border-slate-800">
    <a href="/" class="flex items-center gap-2 text-brand-900 dark:text-white">
      <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-brand-600 text-white">{{ icon("book-open", "w-5 h-5") }}</span>
      <span class="text-base font-bold tracking-tight">{{ t("brand.name") }}</span>
    </a>
  </div>

  <nav class="flex-1 space-y-1 overflow-y-auto p-3">
    {% set variant = "sidebar" %}
    {% set close_expr = "sidebar_open = false" %}
    {% include "partials/nav_list.html" %}
  </nav>
</aside>
