{% extends "base.html" %}
{% block title %}{{ t("errors.not_found_title") }} · {{ t("brand.name") }}{% endblock %}
{% block content %}
<div class="mx-auto w-full max-w-md py-20 text-center">
  <p class="text-5xl font-bold text-slate-300 dark:text-slate-600">404</p>
  <h1 class="mt-3 text-xl font-semibold text-slate-900 dark:text-white">{{ t("errors.not_found_title") }}</h1>
  <p class="mt-2 text-sm text-slate-600 dark:text-slate-400">{{ t("errors.not_found_desc") }}</p>
  <a href="/" class="btn btn-primary mt-6">{{ t("errors.back_home") }}</a>
</div>
{% endblock %}
