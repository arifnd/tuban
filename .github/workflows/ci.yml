name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Ruff format check
        run: uv run ruff format --check src tests alembic
      - name: Ruff lint
        run: uv run ruff check src tests alembic
      - name: Tests with coverage (SQLite)
        run: uv run pytest --cov -n auto

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tuban
          POSTGRES_PASSWORD: tuban
          POSTGRES_DB: tuban
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://tuban:tuban@localhost:5432/tuban
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Tests (PostgreSQL)
        run: uv run pytest -n auto
